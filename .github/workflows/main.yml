name: Build Battuk Debug APK

# The actual Gradle project (settings.gradle.kts, gradlew, app/) lives at
# Battuk-Android-Phase1/battuk in this repo, NOT at the repo root — so every
# run: step below is pointed there via the job-level working-directory default,
# and the artifact upload path is prefixed to match.
#
# If you'd rather avoid this nesting altogether, move everything OUT of
# Battuk-Android-Phase1/battuk/ up to the repo root instead, delete the now-empty
# Battuk-Android-Phase1 folder, and switch back to the simpler workflow (no
# working-directory / path prefix needed). Either approach works — this one
# just matches your repo exactly as it is right now.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Battuk-Android-Phase1/battuk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Confirm Gradle wrapper is present and executable
        run: |
          test -f ./gradlew
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: battuk-debug-apk
          # Not affected by working-directory (upload-artifact paths are always
          # relative to the repo root), so the nested path is spelled out here.
          path: Battuk-Android-Phase1/battuk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
