name: Build Battuk Debug APK

# Repo root IS the Gradle root (settings.gradle.kts lives at the top level),
# so no working-directory override is needed anywhere in this workflow.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the official action instead of raw `sdkmanager` calls, which
      # installs and PATHs the Android command-line tools correctly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Confirm Gradle wrapper is present and executable
        run: |
          test -f ./gradlew
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: battuk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
